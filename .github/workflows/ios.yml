name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ secrets.BUNDLE_ID || 'com.manul.pocket' }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Проверить секреты
        run: |
          for v in TEAM_ID KEY_ID ISSUER_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::не задан секрет $v — см. README"
              exit 1
            fi
          done

      - name: Выбрать Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Установить XcodeGen
        run: brew install xcodegen

      - name: Положить ключ App Store Connect
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo -n "${{ secrets.ASC_KEY_P8 }}" | base64 --decode \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"

      - name: Сгенерировать проект
        working-directory: app
        run: xcodegen generate

      - name: Собрать архив
        working-directory: app
        run: |
          xcodebuild archive \
            -project Pocket.xcodeproj \
            -scheme Pocket \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Pocket.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID"

      - name: Экспорт IPA
        working-directory: app
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$PWD/build/Pocket.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-ipa
          path: app/build/export/*.ipa
          if-no-files-found: error

      - name: Отправить в TestFlight
        if: github.ref == 'refs/heads/main'
        run: |
          IPA=$(find app/build/export -name "*.ipa" | head -n 1)
          echo "uploading $IPA"
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
