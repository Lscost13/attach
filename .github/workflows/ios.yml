name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      BUNDLE_ID: ${{ secrets.BUNDLE_ID || 'com.manul.pocket' }}

    steps:
      - uses: actions/checkout@v4

      - name: Выбрать Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Установить XcodeGen
        run: brew install xcodegen

      - name: Сгенерировать проект
        working-directory: app
        run: xcodegen generate

      - name: Собрать без подписи
        working-directory: app
        run: |
          xcodebuild build \
            -project Pocket.xcodeproj \
            -scheme Pocket \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Упаковать IPA
        working-directory: app
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP" ]; then echo "::error::.app не найден"; exit 1; fi
          echo "app: $APP"
          rm -rf Payload Pocket.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Pocket.ipa Payload
          unzip -l Pocket.ipa | head -n 20

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-ipa
          path: app/Pocket.ipa
          if-no-files-found: error
