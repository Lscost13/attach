name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      widgets:
        description: "Собрать с Live Activity"
        type: boolean
        default: true
      engine:
        description: "Включить движок DSH (выкл — лёгкая сборка для теста)"
        type: boolean
        default: true
      bundle_id:
        description: "Bundle ID (пусто — com.manul.attach)"
        type: string
        default: ""

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # arm64-раннеры GitHub регулярно не выдают («capacity constraints»),
    # а Intel-пул свободнее. Для сборки это не важно — хост лишь запускает Xcode.
    runs-on: macos-15-intel
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      BUNDLE_ID: ${{ inputs.bundle_id != '' && inputs.bundle_id || secrets.BUNDLE_ID || 'com.manul.attach' }}

    steps:
      - uses: actions/checkout@v4

      - name: Кэш Node-фреймворка
        uses: actions/cache@v4
        with:
          path: vendor/nodejs-mobile
          key: nodejs-mobile-24.20.0-0

      - name: Скачать NodeMobile
        run: |
          chmod +x scripts/fetch-node.sh
          ./scripts/fetch-node.sh

      - name: Кэш ядра (npm)
        if: inputs.engine != 'false'
        uses: actions/cache@v4
        with:
          path: app/Engine/node_modules
          key: dsh-0.2.2-rc.5-${{ hashFiles('app/Engine/package-lock.json') }}

      - name: Установить ядро
        if: inputs.engine != 'false'
        working-directory: app/Engine
        run: |
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          du -sh node_modules

      - name: Починить дерево пакетов
        if: inputs.engine != 'false'
        working-directory: app/Engine
        run: |
          node ../../scripts/clean-engine.mjs
          node ../../scripts/patch-engine.mjs .

      - name: Вычистить нативные бинарники
        if: inputs.engine != 'false'
        working-directory: app/Engine
        run: |
          find node_modules -type f \( -name '*.node' -o -name '*.dylib' -o -name '*.so' -o -name '*.so.*' -o -name '*.a' -o -name '*.exe' -o -name '*.dll' \) -delete
          find node_modules -type f \( -name '*.map' -o -name '*.d.ts' \) -delete
          du -sh node_modules

      - name: Проверить запуск ядра
        if: inputs.engine != 'false'
        working-directory: app
        run: |
          # Архив распаковывает само ядро; в проверке он уже разложен,
          # поэтому ставим отметку «распаковано».
          mkdir -p "$HOME/.attach"
          touch "$HOME/.attach/engine-ready"
          node --expose-internals Engine/main.js > /tmp/engine.log 2>&1 &
          ok=0
          for i in $(seq 1 120); do
            if grep -q "dsh web:" /tmp/engine.log 2>/dev/null; then ok=1; echo "engine up after ${i}s"; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then echo "::error::ядро не поднялось"; tail -n 120 /tmp/engine.log; exit 1; fi
          grep "dsh web:" /tmp/engine.log | tail -n 1

      - name: Упаковать движок
        if: inputs.engine != 'false'
        working-directory: app
        run: |
          rm -f engine.bin
          node ../scripts/pack-engine.mjs Engine engine.bin
          du -h engine.bin

      - name: Опубликовать движок
        if: inputs.engine != 'false'
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="engine-latest"
          gh release delete "$tag" --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create "$tag" engine.bin \
            --title "Движок Attach" \
            --notes "Архив движка DSH для первого запуска. Пересобирается каждой сборкой." \
            --repo "${{ github.repository }}"

      - name: Конфигурация проекта
        working-directory: app
        env:
          WIDGETS: ${{ inputs.widgets }}
          ENGINE: ${{ inputs.engine }}
        run: |
          if [ "$WIDGETS" = "false" ]; then
            cp project-lite.yml project.yml
            echo "WITH_WIDGETS=0" >> "$GITHUB_ENV"
          else
            echo "WITH_WIDGETS=1" >> "$GITHUB_ENV"
          fi
          if [ "$ENGINE" = "false" ]; then
            echo "WITH_ENGINE=0" >> "$GITHUB_ENV"
          else
            echo "WITH_ENGINE=1" >> "$GITHUB_ENV"
          fi

      - name: Скрипт запуска ядра в бандл
        working-directory: app
        run: |
          cp Engine/main.js Attach/engine-main.js
          ls -l Attach/engine-main.js

      - name: Выбрать Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Установить XcodeGen
        run: brew install xcodegen

      - name: Сгенерировать проект
        working-directory: app
        run: xcodegen generate


      - name: Сертификат и профиль
        env:
          CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.SIGNING_PROFILE }}
        run: |
          if [ -z "$CERT_P12" ] || [ -z "$PROFILE_B64" ]; then
            echo "::error::нет секретов подписи (SIGNING_CERT_P12 / SIGNING_PROFILE)"
            exit 1
          fi

          # Ключница для подписи
          security create-keychain -p actions build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security unlock-keychain -p actions build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')

          printf '%s' "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain > /dev/null

          printf '%s' "$PROFILE_B64" | base64 --decode > /tmp/profile.mobileprovision
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i /tmp/profile.mobileprovision > /tmp/profile.plist
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile.plist)
          cp /tmp/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

          echo "--- подписывающие сертификаты ---"
          security find-identity -v -p codesigning build.keychain
          /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/profile.plist

      - name: Собрать с подписью
        working-directory: app
        env:
          TEAM: ${{ secrets.TEAM_ID }}
          BUILD: ${{ github.run_number }}
        run: |
          xcodebuild build \
            -project Attach.xcodeproj \
            -scheme Attach \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$TEAM" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            ONLY_ACTIVE_ARCH=NO

      - name: Упаковать IPA
        working-directory: app
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP" ]; then echo "::error::.app не найден"; exit 1; fi
          echo "app: $APP"
          du -sh "$APP"
          if [ "$WITH_WIDGETS" = "1" ] && [ ! -d "$APP/PlugIns/AttachWidgets.appex" ]; then
            echo "::error::расширение AttachWidgets не встроено в бандл"
            ls -la "$APP/PlugIns" || true
            exit 1
          fi
          echo "--- подпись приложения ---"
          codesign -dv --entitlements - "$APP" 2>&1 | head -n 20
          if ! codesign --verify --deep --strict "$APP"; then
            echo "::error::подпись не прошла проверку"
            exit 1
          fi
          rm -rf Payload Attach.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          # Эппловский формат архива: без resource fork и лишних атрибутов.
          ditto -c -k --norsrc --keepParent Payload Attach.ipa
          unzip -t Attach.ipa > /dev/null && echo "ipa: архив целый"
          du -h Attach.ipa

      - name: Манифест для установки с телефона
        working-directory: app
        run: |
          BUILD="${{ github.run_number }}"
          cat > manifest.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key>
                    <string>software-package</string>
                    <key>url</key>
                    <string>https://lscost13.github.io/attach/Attach.ipa</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key>
                  <string>$BUNDLE_ID</string>
                  <key>bundle-version</key>
                  <string>$BUILD</string>
                  <key>kind</key>
                  <string>software</string>
                  <key>title</key>
                  <string>Attach</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST
          plutil -lint manifest.plist

      - name: Опубликовать IPA
        if: github.event_name == 'workflow_dispatch'
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          gh release create "$tag" Attach.ipa manifest.plist \
            --title "Attach · сборка ${{ github.run_number }}" \
            --notes "IPA + манифест для установки по воздуху." \
            --repo "${{ github.repository }}"
          echo "https://github.com/${{ github.repository }}/releases/download/$tag/Attach.ipa"

      - name: Выложить для установки по воздуху
        if: github.event_name == 'workflow_dispatch'
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          cp Attach.ipa manifest.plist site/
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="ru"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Attach</title>
          <style>
            body { background:#000; color:#fff; font: 17px -apple-system, system-ui, sans-serif;
                   display:flex; min-height:100vh; margin:0; align-items:center; justify-content:center; }
            .card { text-align:center; padding:32px; }
            a { display:inline-block; margin-top:24px; padding:16px 32px; border-radius:18px;
                background:#fff; color:#000; text-decoration:none; font-weight:600; }
          </style></head>
          <body><div class="card">
            <h1>Attach</h1>
            <p>Нажми кнопку — iOS предложит установить сборку.</p>
            <a href="itms-services://?action=download-manifest&amp;url=https://lscost13.github.io/attach/manifest.plist">Установить</a>
          </div></body></html>
          HTML
          cd site
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "сборка ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
          echo "http://lscost13.github.io/attach/"

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: Attach-ipa
          path: app/Attach.ipa
          if-no-files-found: error
