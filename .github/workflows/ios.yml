name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      widgets:
        description: "Собрать с Live Activity"
        type: boolean
        default: true
      engine:
        description: "Включить движок DSH (выкл — лёгкая сборка для теста)"
        type: boolean
        default: true
      bundle_id:
        description: "Bundle ID (пусто — com.manul.attach)"
        type: string
        default: ""

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      BUNDLE_ID: ${{ inputs.bundle_id != '' && inputs.bundle_id || secrets.BUNDLE_ID || 'com.manul.attach' }}

    steps:
      - uses: actions/checkout@v4

      - name: Кэш Node-фреймворка
        uses: actions/cache@v4
        with:
          path: vendor/nodejs-mobile
          key: nodejs-mobile-24.20.0-0

      - name: Скачать NodeMobile
        run: |
          chmod +x scripts/fetch-node.sh
          ./scripts/fetch-node.sh

      - name: Кэш ядра (npm)
        if: inputs.engine != 'false'
        uses: actions/cache@v4
        with:
          path: app/Engine/node_modules
          key: dsh-0.2.2-rc.5-${{ hashFiles('app/Engine/package-lock.json') }}

      - name: Установить ядро
        if: inputs.engine != 'false'
        working-directory: app/Engine
        run: |
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          du -sh node_modules

      - name: Починить дерево пакетов
        if: inputs.engine != 'false'
        working-directory: app/Engine
        run: |
          node ../../scripts/clean-engine.mjs
          node ../../scripts/patch-engine.mjs .

      - name: Вычистить нативные бинарники
        if: inputs.engine != 'false'
        working-directory: app/Engine
        run: |
          find node_modules -type f \( -name '*.node' -o -name '*.dylib' -o -name '*.so' -o -name '*.so.*' -o -name '*.a' -o -name '*.exe' -o -name '*.dll' \) -delete
          find node_modules -type f \( -name '*.map' -o -name '*.d.ts' \) -delete
          du -sh node_modules

      - name: Проверить запуск ядра
        if: inputs.engine != 'false'
        working-directory: app
        run: |
          node --expose-internals Engine/main.js > /tmp/engine.log 2>&1 &
          ok=0
          for i in $(seq 1 120); do
            if grep -q "dsh web:" /tmp/engine.log 2>/dev/null; then ok=1; echo "engine up after ${i}s"; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then echo "::error::ядро не поднялось"; tail -n 120 /tmp/engine.log; exit 1; fi
          grep "dsh web:" /tmp/engine.log | tail -n 1

      - name: Упаковать движок
        if: inputs.engine != 'false'
        working-directory: app
        run: |
          rm -f engine.bin
          node ../scripts/pack-engine.mjs Engine engine.bin
          du -h engine.bin

      - name: Опубликовать движок
        if: inputs.engine != 'false'
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="engine-latest"
          gh release delete "$tag" --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create "$tag" engine.bin \
            --title "Движок Attach" \
            --notes "Архив движка DSH для первого запуска. Пересобирается каждой сборкой." \
            --repo "${{ github.repository }}"

      - name: Конфигурация проекта
        working-directory: app
        env:
          WIDGETS: ${{ inputs.widgets }}
          ENGINE: ${{ inputs.engine }}
        run: |
          if [ "$WIDGETS" = "false" ]; then
            cp project-lite.yml project.yml
            echo "WITH_WIDGETS=0" >> "$GITHUB_ENV"
          else
            echo "WITH_WIDGETS=1" >> "$GITHUB_ENV"
          fi
          if [ "$ENGINE" = "false" ]; then
            echo "WITH_ENGINE=0" >> "$GITHUB_ENV"
          else
            echo "WITH_ENGINE=1" >> "$GITHUB_ENV"
          fi

      - name: Выбрать Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Установить XcodeGen
        run: brew install xcodegen

      - name: Сгенерировать проект
        working-directory: app
        run: xcodegen generate


      - name: Собрать без подписи
        working-directory: app
        run: |
          xcodebuild build \
            -project Attach.xcodeproj \
            -scheme Attach \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Упаковать IPA
        working-directory: app
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP" ]; then echo "::error::.app не найден"; exit 1; fi
          echo "app: $APP"
          du -sh "$APP"
          if [ "$WITH_WIDGETS" = "1" ] && [ ! -d "$APP/PlugIns/AttachWidgets.appex" ]; then
            echo "::error::расширение AttachWidgets не встроено в бандл"
            ls -la "$APP/PlugIns" || true
            exit 1
          fi
          if [ -d "$APP/PlugIns/AttachWidgets.appex" ]; then
            echo "--- extension signature ---"
            codesign -dv "$APP/PlugIns/AttachWidgets.appex" 2>&1 | head -n 6 || true
          fi
          rm -rf Payload Attach.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          # Эппловский формат архива: без resource fork и лишних атрибутов.
          ditto -c -k --norsrc --keepParent Payload Attach.ipa
          unzip -t Attach.ipa > /dev/null && echo "ipa: архив целый"
          du -h Attach.ipa

      - name: Опубликовать IPA
        if: github.event_name == 'workflow_dispatch'
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          gh release create "$tag" Attach.ipa \
            --title "Attach · сборка ${{ github.run_number }}" \
            --notes "Прямая ссылка на IPA, без zip и распаковки." \
            --repo "${{ github.repository }}"
          echo "https://github.com/${{ github.repository }}/releases/download/$tag/Attach.ipa"

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: Attach-ipa
          path: app/Attach.ipa
          if-no-files-found: error
